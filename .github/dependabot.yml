version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
    groups: {cargo: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    ignore:
      # TypeScript 7 is the native port and has no JS API; svelte-check 4.x crashes loading it. Revisit when
      # svelte-check supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups: {npm: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /e2e
    schedule: {interval: weekly}
    groups: {npm: {patterns: ["*"]}}
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: {interval: weekly}
    groups: {cargo: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    # init, analyze and upload-sarif must run the same release ("Loaded a configuration file for version ...").
    groups: {codeql-action: {patterns: ["github/codeql-action/*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
