# Secret-scan settings (gitleaks reads this file from the repository root).
# Everything else keeps the default rules.
title = "Bosun"

[extend]
useDefault = true

[[allowlists]]
description = "Public protocol sample values"
regexes = [
  # The example Sec-WebSocket-Key from RFC 6455 section 1.3 ("the sample nonce"), used by the WebSocket tests.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
]

# The UI source names its localStorage keys ("bosun.prefs.v1") and keyboard shortcuts ("Alt+Shift+ArrowUp"), which the
# generic-api-key entropy rule mistakes for keys. Only that one rule, only under web/src; every other rule still applies.
[[allowlists]]
description = "UI storage-key names and shortcut strings"
targetRules = ["generic-api-key"]
paths = ['''^web/src/''']

# The passive scanner's unit tests feed it a truncated, fake PEM block ("MIIE") to prove the private-key rule fires.
# Only that rule, only in that file; every other rule still applies there.
[[allowlists]]
description = "Fake PEM fixture in the scanner's tests"
targetRules = ["private-key"]
paths = ['''^crates/bosun-scan/src/rules\.rs$''']
