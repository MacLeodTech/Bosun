[package]
name = "bosun-desktop"
description = "Bosun desktop app: the engine in-process, the web UI in a native window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Not a default workspace member: building it needs the platform webview
# (Linux: libwebkit2gtk-4.1-dev, libgtk-3-dev, libayatana-appindicator3-dev, librsvg2-dev).
# Build with `cargo build -p bosun-desktop` (after `npm --prefix web run build`).

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
bosun.workspace = true
tauri = { version = "2.12", features = [] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
