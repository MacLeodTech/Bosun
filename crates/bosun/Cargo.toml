[package]
name = "bosun"
description = "Bosun: a free, low-footprint intercepting proxy and DAST toolkit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bosun"
path = "src/lib.rs"

[[bin]]
name = "bosun"
path = "src/main.rs"

[dependencies]
bosun-model.workspace = true
bosun-ca.workspace = true
bosun-store.workspace = true
bosun-scope.workspace = true
bosun-proxy.workspace = true
bosun-api.workspace = true
bosun-client.workspace = true
bosun-report.workspace = true
bosun-codec.workspace = true
bosun-import.workspace = true
url = "2"
tempfile.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["io-std"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
time.workspace = true
rpassword.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[dev-dependencies]
bosun-testbed = { path = "../bosun-testbed" }
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
