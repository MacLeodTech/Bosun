# cargo-deny policy. Run: cargo deny --workspace check

[graph]
all-features = false

[advisories]
# RustSec database. Yanked crates are errors; unmaintained crates are reported.
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # rsa (Marvin attack, no fixed release): reached only through openidconnect, which uses it to verify RS256
  # ID-token signatures with the provider's public key. The timing leak is in private-key operations, and Bosun
  # never decrypts or signs with RSA. Revisit when rsa ships a fix (WP-34).
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no private-key RSA operations" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",   # webpki-roots (the Mozilla root list)
  "MPL-2.0",               # file-level copyleft only; used unmodified
]
confidence-threshold = 0.9

[licenses.private]
# Our own crates are never published and carry the project licence (LICENSE).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No OpenSSL in the default build: TLS is rustls only. (A future `legacy-tls` feature for very old targets will
# be opt-in and listed here as an exception.)
deny = [
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
