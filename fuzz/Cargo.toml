[package]
name = "bosun-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bosun-model = { path = "../crates/bosun-model" }
bosun-scope = { path = "../crates/bosun-scope" }
bosun-store = { path = "../crates/bosun-store" }
bosun-proxy = { path = "../crates/bosun-proxy" }
bosun-http = { path = "../crates/bosun-http" }
bosun-codec = { path = "../crates/bosun-codec" }
bosun-import = { path = "../crates/bosun-import" }

# Not part of the main workspace: it needs nightly and is built only by `cargo fuzz`.
[workspace]

[[bin]]
name = "http_messages"
path = "fuzz_targets/http_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frames"
path = "fuzz_targets/ws_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_body"
path = "fuzz_targets/decode_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scope_rules"
path = "fuzz_targets/scope_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rewrite_rules"
path = "fuzz_targets/rewrite_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_project"
path = "fuzz_targets/import_project.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raw_framing"
path = "fuzz_targets/raw_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "history_query"
path = "fuzz_targets/history_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engage"
path = "fuzz_targets/engage.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_formats"
path = "fuzz_targets/import_formats.rs"
test = false
doc = false
